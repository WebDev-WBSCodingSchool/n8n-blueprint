# n8n on Render (free tier) - classroom blueprint
#
# After the first deploy, open the web service in the Render dashboard,
# copy its public URL (https://<name>.onrender.com) and add the env var
# N8N_WEBHOOK_URL with that value. Render redeploys automatically.

services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      # Pinned on purpose: "latest" can pull a new major version and
      # re-run migrations under you in the middle of class.
      url: docker.io/n8nio/n8n:2.46.6

    # Lets Render wait until n8n is really up instead of guessing from
    # the first open port. Avoids the "restarting deploy" loop during
    # migrations.
    healthCheckPath: /healthz

    envVars:
      # ---- required, do not change after first deploy ----
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # ---- database (auto-wired to the Postgres below) ----
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase: { name: n8n-db, property: database }
      - key: DB_POSTGRESDB_HOST
        fromDatabase: { name: n8n-db, property: host }
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase: { name: n8n-db, property: password }
      - key: DB_POSTGRESDB_USER
        fromDatabase: { name: n8n-db, property: user }

      # ---- memory: the free box has 512 MB total ----
      - key: NODE_OPTIONS
        value: --max-old-space-size=360

      # ---- networking / proxy ----
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PROXY_HOPS          # Render sits in front as a reverse proxy
        value: "1"
      # N8N_WEBHOOK_URL is NOT set here on purpose. The public URL does not
      # exist until the service is created, so students add it by hand in
      # the dashboard after the first deploy (Step 3 of the course guide).

      # ---- task runners: slow cold starts need a longer grant window ----
      - key: N8N_RUNNERS_GRANT_TOKEN_TTL
        value: "180"
      - key: N8N_RUNNERS_TASK_TIMEOUT
        value: "300"

      # ---- keep the database small and memory low ----
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "72"
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "300"
      - key: EXECUTIONS_DATA_SAVE_ON_PROGRESS
        value: "false"

      # ---- turn off things that cost memory or make outbound calls ----
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_TEMPLATES_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_COMMUNITY_PACKAGES_ENABLED
        value: "false"
      - key: N8N_UNVERIFIED_PACKAGES_ENABLED
        value: "false"
      - key: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
        value: "268435456"
      - key: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
        value: "1000"

      - key: GENERIC_TIMEZONE
        value: Europe/Berlin   # change to your timezone

databases:
  - name: n8n-db
    plan: free
    # NOTE: free Render Postgres expires 30 days after creation and is
    # deleted 14 days later. Export workflows before then, or upgrade.
